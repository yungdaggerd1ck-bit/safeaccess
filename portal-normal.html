<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de acesso com EPI — protótipo 3D</title>
<style>
:root{--bg:#efece6;--fg:#1d1d1b;--mu:#6b675f;--pn:#fbfaf8;--bd:#d6d1c6;--ac:#1f5fbf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#c{flex:1;min-height:0;position:relative;touch-action:none}
#c canvas{display:block;width:100%;height:100%}
#p{background:var(--pn);border-top:1px solid var(--bd);padding:10px 14px 12px}
.st,.op{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:8px}
.st span{color:var(--mu)}.st b{color:var(--fg)}
.op label{display:flex;align-items:center;gap:6px}
button{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;width:100%}
button:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#log{margin-top:8px;height:64px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mu)}
#log div:first-child{color:var(--fg)}
</style></head><body>
<div id="c"></div>
<div id="p">
 <div class="st"><span>Estado: <b id="s1">Em espera</b></span><span>Servo: <b id="s2">0°</b></span><span>Lâmpada: <b id="s3">vermelha</b></span></div>
 <div class="op"><label><input type="checkbox" id="hel" checked> Capacete</label><label><input type="checkbox" id="vest" checked> Colete</label><label><input type="checkbox" id="card" checked> Cartão cadastrado</label><label><input type="checkbox" id="xr" checked> Ver por dentro</label></div>
 <button id="go">Passar pelo portal</button>
 <div id="log"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),wrap=$('c');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.shadowMap.enabled=true;R.setPixelRatio(Math.min(devicePixelRatio,2));wrap.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,1,400);
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}
addEventListener('resize',fit);
S.add(new THREE.HemisphereLight(0xffffff,0x8a8070,.8));
const DL=new THREE.DirectionalLight(0xffffff,.8);DL.position.set(25,45,30);DL.castShadow=true;
Object.assign(DL.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:140});DL.shadow.mapSize.set(1024,1024);S.add(DL);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o));
const B=(w,h,d,m,x,y,z,p=S)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p.add(o);return o};
const Sp=(r,m,x,y,z,p=S)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o};
const wire=(pts,c)=>{S.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(...p))),new THREE.LineBasicMaterial({color:c})))};

// Base e carcaça (cm)
const mdf=M(0xc9a373),mdf2=M(0xdbbf92),vidro=M(0xc9a373,{transparent:true,opacity:.25});
B(30,.3,30,mdf,0,.15,0);
B(30,3,.3,vidro,0,1.5,-14.85);B(30,3,.3,vidro,0,1.5,14.85);B(.3,3,29.4,vidro,-14.85,1.5,0);B(.3,3,29.4,vidro,14.85,1.5,0);
B(3,20,10,mdf2,-6.5,10.3,0);B(3,20,10,mdf2,6.5,10.3,0);B(16,3,10,mdf2,0,21.5,0);

// Lâmpadas
const gM=M(0x1c7a35,{emissive:0x2cff5c,emissiveIntensity:.05}),rM=M(0x8a1c1c,{emissive:0xff2a2a,emissiveIntensity:1.6});
Sp(1,gM,-2.5,18.8,3.5);Sp(1,rM,2.5,18.8,3.5);
const lamp=g=>{gM.emissiveIntensity=g?1.6:.05;rM.emissiveIntensity=g?.05:1.6;$('s3').textContent=g?'verde':'vermelha'};

// Leitor RFID RC522 (ao lado do caminho)
B(2.6,3,.4,M(0x1f5fb0),4.5,11,5.2);
B(.4,9.5,.4,mdf2,4.5,4.75,5.2);
const rdM=M(0x333333,{emissive:0x3aa0ff,emissiveIntensity:0});Sp(.18,rdM,4.5,11.8,5.45);

// Sensores de EPI
function sensor(y){const g=new THREE.Group();g.position.set(4.5,y,1.5);S.add(g);
 B(.5,1.2,1.4,M(0x222222),0,0,0,g);
 [-.35,.35].forEach(z=>{const e=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.2,14),M(0xd0d0d0,{metalness:.6}));e.rotation.z=Math.PI/2;e.position.set(-.3,0,z);g.add(e)});
 const m=M(0x555555,{emissive:0x000000});Sp(.18,m,0,.8,0,g);return m}
const sH=sensor(14.7),sV=sensor(10.9);
const led=(m,c)=>{m.color.set(c);m.emissive.set(c)};
const leds=(a,b)=>{led(sH,a);led(sV,b)};

// Catraca (barreira que gira em torno do poste)
const P=new THREE.Group();P.position.set(-4.6,.3,0);S.add(P);
B(1.2,.6,1.2,M(0x1f3fb0),0,.3,0,P);
const poste=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,3,14),M(0xeeeeee));poste.position.set(0,1.8,0);P.add(poste);
B(8.8,.5,.5,M(0xb98b55),4.4,1.6,0,P);
const setServo=a=>{P.rotation.y=a*Math.PI/180;$('s2').textContent=Math.round(a)+'°'};

// ESP32 dentro da base
const E=new THREE.Group();E.position.set(10,.45,8);S.add(E);
B(5.2,.25,2.8,M(0x151515),0,0,0,E);B(2.4,.3,1.8,M(0xcfcfcf,{metalness:.6}),.8,.28,0,E);B(.8,.4,.7,M(0xaaaaaa,{metalness:.7}),-2.4,.3,0,E);
const eM=M(0x333333,{emissive:0x2cff5c,emissiveIntensity:0});Sp(.15,eM,-1.4,.25,.9,E);
setInterval(()=>{eM.emissiveIntensity=eM.emissiveIntensity?0:1.5},500);
wire([[10,.6,8],[4.5,.6,5.2],[4.5,9.5,5.2]],0xe03a3a);
wire([[10,.6,8],[4.5,.6,1.5],[4.5,10.9,1.5]],0x2cb05a);
wire([[10,.6,8],[-4.6,.6,8],[-4.6,.6,0]],0xf2c200);

// Operador
const D=new THREE.Group();D.position.set(0,.3,12);S.add(D);
const skin=M(0xc68a5c),shirt=M(0x1f4e8c),pants=M(0x1f4e8c),boot=M(0x23262b);
const limb=(x,y,w,h,m)=>{const g=new THREE.Group();g.position.set(x,y,0);D.add(g);B(w,h,w,m,0,-h/2,0,g);return g};
const legL=limb(-1.1,5,1.5,5,pants),legR=limb(1.1,5,1.5,5,pants),armL=limb(-2.6,10,1,4,shirt),armR=limb(2.6,10,1,4,shirt);
[legL,legR].forEach(l=>B(1.8,1.4,2.8,boot,0,-4.3,-0.4,l));
B(4,5,2,shirt,0,7.5,0,D);Sp(1.5,skin,0,11.7,0,D);B(.5,.5,.5,skin,0,11.6,-1.6,D);[-.55,.55].forEach(x=>Sp(.28,M(0x111111),x,11.9,-1.3,D));
const helG=new THREE.Group();D.add(helG);
const helm=new THREE.Mesh(new THREE.SphereGeometry(1.75,20,10,0,Math.PI*2,0,Math.PI/2),M(0xf2c200,{side:THREE.DoubleSide}));helm.position.set(0,11.9,0);helm.castShadow=true;helG.add(helm);
B(3.9,.22,1.6,M(0xf2c200),0,12.1,-1.3,helG);
const vestG=new THREE.Group();D.add(vestG);B(4.2,3.6,2.2,M(0xff6a00),0,7.9,0,vestG);B(4.25,.4,2.25,M(0xdddddd,{metalness:.4}),0,8.5,0,vestG);B(4.25,.4,2.25,M(0xdddddd,{metalness:.4}),0,7.2,0,vestG);
const cardM=B(1.6,.05,1,M(0xffffff),0,12,7.5);cardM.visible=false;B(1.6,.06,.25,M(0x1f5fb0),0,0,.3,cardM);

// Animação de caminhada
let walk=0,ph=0;
function pose(){const s=Math.sin(ph)*.6*walk;legL.rotation.x=s;legR.rotation.x=-s;armL.rotation.x=-s*.8;armR.rotation.x=s*.8}

// Câmera orbital (arrastar = girar, pinça/roda = zoom)
let th=.55,pp=1.12,rr=70;const tg=new THREE.Vector3(0,9,2),pts=new Map();let pd=0;
wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);pts.set(e.pointerId,e)});
wrap.addEventListener('pointerup',e=>pts.delete(e.pointerId));wrap.addEventListener('pointercancel',e=>pts.delete(e.pointerId));
wrap.addEventListener('pointermove',e=>{const o=pts.get(e.pointerId);if(!o)return;
 if(pts.size==1){th-=(e.clientX-o.clientX)*.007;pp=Math.min(1.5,Math.max(.25,pp-(e.clientY-o.clientY)*.007))}
 pts.set(e.pointerId,e);if(pts.size==2){const [a,b]=[...pts.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)rr=Math.min(120,Math.max(28,rr*pd/d));pd=d}else pd=0});
wrap.addEventListener('wheel',e=>{e.preventDefault();rr=Math.min(120,Math.max(28,rr*(1+e.deltaY*.001)))},{passive:false});

// Lógica do sistema
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tween=(ms,fn)=>new Promise(r=>{const t0=performance.now();(function s(){const k=Math.min(1,(performance.now()-t0)/ms);fn(k);k<1?requestAnimationFrame(s):r()})()});
const ease=k=>k*k*(3-2*k);
const state=t=>$('s1').textContent=t;
const logEl=$('log');
function log(t){const d=document.createElement('div');d.textContent=t;logEl.prepend(d);while(logEl.children.length>40)logEl.lastChild.remove()}
const DB={'04 A3 5F 1C':'Aluno 01'};
let busy=false,last=performance.now();

async function servoTo(a0,a1){log('ESP32 → servo SG90: '+a0+'° → '+a1+'°');await tween(900,k=>setServo(a0+(a1-a0)*ease(k)))}
async function walkTo(z,ms){walk=1;const z0=D.position.z;await tween(ms,k=>{D.position.z=z0+(z-z0)*k});walk=0}
async function deny(){
 state('Acesso negado');
 for(let i=0;i<3;i++){lamp(true);await sleep(200);lamp(false);await sleep(200)}
 lamp(false);await sleep(300);await walkTo(12,1400);
}
function finish(){state('Em espera');busy=false;$('go').disabled=false}

async function run(){
 if(busy)return;busy=true;$('go').disabled=true;
 const hel=$('hel').checked,vest=$('vest').checked,known=$('card').checked;
 const uid=known?'04 A3 5F 1C':'7E 22 91 0B';
 helG.visible=hel;vestG.visible=vest;leds(0x555555,0x555555);setServo(0);lamp(false);
 D.visible=true;D.position.set(0,.3,12);
 state('Aproximando-se do leitor');log('Operador se aproxima do portal');
 await walkTo(7.6,1600);
 state('Lendo cartão');cardM.visible=true;rdM.emissiveIntensity=1.5;
 await tween(800,k=>cardM.position.set(4.5*k,9+1.5*k,7.2+(5.6-7.2)*k));
 log('RC522: UID '+uid);await sleep(500);cardM.visible=false;rdM.emissiveIntensity=0;
 if(!DB[uid]){log('Banco de dados: cartão não cadastrado');await deny();log('Ciclo encerrado');finish();return}
 log('Banco de dados: '+DB[uid]+' autorizado');
 state('Verificando EPI');await walkTo(2.6,1000);await sleep(400);
 leds(hel?0x2cff5c:0xff2a2a,vest?0x2cff5c:0xff2a2a);
 log('Sensores: capacete '+(hel?'OK':'AUSENTE')+', colete '+(vest?'OK':'AUSENTE'));await sleep(800);
 if(!(hel&&vest)){log('EPI incompleto: acesso negado');await deny();leds(0x555555,0x555555);log('Ciclo encerrado');finish();return}
 state('Acesso liberado');lamp(true);log('ESP32: lâmpada verde acesa');
 await servoTo(0,90);
 await walkTo(-12,3200);
 D.visible=false;
 await servoTo(90,0);lamp(false);leds(0x555555,0x555555);
 log('Ciclo concluído: catraca travada');finish();
}
$('go').onclick=run;
$('xr').onchange=e=>{vidro.opacity=e.target.checked?.25:1};

fit();setServo(0);log('Arraste para girar a câmera; pince ou use a roda para zoom.');
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 ph+=walk*dt*7;pose();
 C.position.set(tg.x+rr*Math.sin(pp)*Math.sin(th),tg.y+rr*Math.cos(pp),tg.z+rr*Math.sin(pp)*Math.cos(th));C.lookAt(tg);
 R.render(S,C);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
